name: lnmp-zabbix

services:
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8081:80", "127.0.0.1:8443:443"]
    volumes:
      - ./app:/var/www/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped
    networks: [web]
  php:
    build: ./php
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE:-app}
      DB_USER: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
    volumes: [./app:/var/www/html]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "php", "/var/www/html/healthcheck.php"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    restart: unless-stopped
    networks: [web, backend]
  mysql:
    image: mysql:8.4
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [backend]
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    networks: [backend]
  zabbix-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZBX_POSTGRES_PASSWORD:?Set ZBX_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: zabbix
    volumes: [zabbix_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [zabbix]
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    ports: ["127.0.0.1:10051:10051"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZBX_POSTGRES_PASSWORD:?Set ZBX_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: zabbix
      ZBX_CACHESIZE: 128M
    depends_on:
      zabbix-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [zabbix]
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZBX_POSTGRES_PASSWORD:?Set ZBX_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: zabbix
      PHP_TZ: ${TZ:-Asia/Shanghai}
      ZBX_SERVER_NAME: LNMP Monitoring
    depends_on:
      zabbix-server:
        condition: service_started
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
    networks: [zabbix]
  zabbix-agent2:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    environment:
      ZBX_HOSTNAME: lnmp-docker-host
      ZBX_SERVER_HOST: zabbix-server
    volumes:
      - ./zabbix/agent2/docker.conf:/etc/zabbix/zabbix_agent2.d/plugins.d/docker.conf:ro
      - docker_proxy_socket:/run/docker-proxy:ro
    depends_on:
      zabbix-server:
        condition: service_started
      docker-socket-proxy:
        condition: service_started
    restart: unless-stopped
    networks: [zabbix]
  docker-socket-proxy:
    image: nginx:1.28-alpine
    entrypoint: ["/bin/sh", "-c"]
    command: ["rm -f /run/docker-proxy/docker.sock && umask 000 && exec nginx -g 'daemon off;'"]
    volumes:
      - ./docker-socket-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker_proxy_socket:/run/docker-proxy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [SETGID]
    pids_limit: 64
    restart: unless-stopped
    networks: [zabbix]

volumes:
  mysql_data:
  redis_data:
  zabbix_pg:
  docker_proxy_socket:
networks:
  web:
  backend:
  zabbix:
